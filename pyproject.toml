[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"
[project]
name = "cvp-webauthn-assertion-review"
version = "0.1.2"
authors = [{name = "dhtfish98"}]
description = "Offline WebAuthn get assertion verification from a saved ceremony plus explicit trusted registration record; PEM Ed25519/ES256 key profile."
requires-python = ">=3.11"
license = "MIT"
license-files = ["项目文档/LICENSE", "UPSTREAM_LICENSE"]
readme = "项目文档/README.md"
dependencies = ["cryptography==50.0.2", "PyNaCl==1.6.2"]
[project.scripts]
webauthn-assertion-review = "webauthn_assertion_review.cli:entry"
[tool.setuptools.packages.find]
where = ["src"]
